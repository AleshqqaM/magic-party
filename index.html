<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fff3fa">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Вечеринка">
  <meta name="description" content="Выбери куклу, наряди её и устрой волшебную вечеринку!">
  <title>LOL: Волшебная вечеринка</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23d84189'/%3E%3Cpath d='M16 27C13 23 4 19 4 12c0-6 8-8 12-2 4-6 12-4 12 2 0 7-9 11-12 15Z' fill='white'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css?v=2.0">
  <script defer src="content.js?v=2.0"></script>
  <script defer src="art.js?v=2.0"></script>
  <script defer src="audio.js?v=2.0"></script>
  <script defer src="game.js?v=2.0"></script>
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="brand-mark" aria-hidden="true"></span><span><strong>LOL</strong><small>Волшебная вечеринка</small></span></div>
    <ol class="steps" aria-label="Этапы игры"></ol>
    <button type="button" class="sound" aria-pressed="true"></button>
  </header>
  <main id="game"></main>
  <div class="fallback" hidden>
    <svg viewBox="0 0 24 24" width="96" height="96" aria-hidden="true"><path fill="#e0569b" d="M12 21S2 15 2 9c0-5 6-7 10-2 4-5 10-3 10 2 0 6-10 12-10 12Z"/></svg>
    <p>Игра не запустилась. Обновите браузер или откройте страницу ещё раз.</p>
    <button type="button" onclick="location.reload()">Ещё раз</button>
  </div>
  <noscript><p class="fallback-text">Для игры нужен включённый JavaScript.</p></noscript>
  <script>
    // Запасной экран: если скрипты не загрузились или упали (старый браузер), показываем сердечко и кнопку.
    window.addEventListener('load', function () {
      setTimeout(function () {
        if (!(window.MP && window.MP.started)) {
          var f = document.querySelector('.fallback');
          if (f) f.hidden = false;
        }
      }, 400);
    });
  </script>
</body>
</html>
